name: Release readiness

on:
  workflow_run:
    workflows: [CodeQL]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: read

jobs:
  codeql-results:
    name: CodeQL release readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require current main analysis and zero open alerts
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYZED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if [ "$GITHUB_REF" != refs/heads/main ] ||
             { [ "$GITHUB_EVENT_NAME" = workflow_run ] && [ "$ANALYZED_COMMIT" != "$GITHUB_SHA" ]; }; then
            echo "Release readiness must run on the current analyzed main revision." >&2
            exit 1
          fi
          python3 tools/check-codeql-release.py
